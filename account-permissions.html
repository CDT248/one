<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Permissions | ONE ONLINE</title>
<style>
.op-page{font-family:inherit;color:var(--text,#172033);width:100%;min-width:0}.op-page *{box-sizing:border-box}
.op-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 22px;border:1px solid var(--border,#dce8e3);border-radius:16px;background:var(--card,#fff);margin-bottom:16px}
.op-title h2{margin:0 0 5px;font-size:23px;color:var(--text,#172033)}.op-title p{margin:0;color:var(--muted,#64748b);font-size:13px}
.op-user{margin-top:9px;font-size:13px;font-weight:700;color:var(--primary,#087f5b)}
.op-btn{border:1px solid var(--border,#dce8e3);border-radius:9px;padding:10px 14px;background:var(--card,#fff);color:var(--text,#172033);font:inherit;font-size:13px;font-weight:700;cursor:pointer}.op-btn.primary{background:var(--primary,#087f5b);border-color:var(--primary,#087f5b);color:#fff}.op-btn:disabled{opacity:.55;cursor:not-allowed}
.op-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--card,#fff);border:1px solid var(--border,#dce8e3);border-radius:13px;margin-bottom:14px}
.op-groups{display:grid;grid-template-columns:1fr;gap:13px}.op-group{background:var(--card,#fff);border:1px solid var(--border,#dce8e3);border-radius:13px;overflow:hidden;box-shadow:0 5px 18px rgba(15,23,42,.04)}
.op-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--hover,#f0f8f4);border-bottom:1px solid var(--border,#dce8e3);color:var(--text,#172033)}.op-group-head strong{font-size:14px;color:var(--text,#172033)}.op-group-head small{display:block;margin-top:4px;color:var(--muted,#64748b);font-size:11px}
.op-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.op-item{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border-bottom:1px solid var(--border,#e2e8f0);font-size:12px;min-width:0;color:var(--text,#172033)}.op-item:nth-child(odd){border-right:1px solid var(--border,#e2e8f0)}.op-item input{accent-color:var(--primary,#087f5b);width:16px;height:16px;flex:0 0 auto;margin:1px 0 0}.op-item span{line-height:1.45}.op-item small{display:block;color:var(--muted,#64748b);font-size:10px;margin-top:3px}.op-note,.op-error,.op-loading{padding:13px 15px;border-radius:10px;margin-bottom:13px;font-size:12px}.op-note{background:rgba(245,158,11,.12);color:#a16207;border:1px solid rgba(245,158,11,.25)}.op-error{background:rgba(239,68,68,.1);color:#b91c1c;border:1px solid rgba(239,68,68,.25)}.op-loading{background:var(--card,#fff);color:var(--muted,#64748b);border:1px solid var(--border,#dce8e3)}.op-footer{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding:15px;background:var(--card,#fff);border:1px solid var(--border,#dce8e3);border-radius:13px;margin-top:14px}.op-toast{position:fixed;right:20px;bottom:20px;z-index:999999;background:#172033;color:white;padding:12px 16px;border-radius:9px;font-size:13px;display:none;box-shadow:0 8px 25px rgba(0,0,0,.2)}.op-toast.show{display:block}
@media(max-width:620px){.op-grid{grid-template-columns:1fr}.op-item:nth-child(odd){border-right:0}.op-head{padding:15px}.op-title h2{font-size:20px}.op-footer .op-btn{flex:1}}
</style>
</head><body>
<div class="op-page">
 <header class="op-head"><div class="op-title"><h2>Account Permissions</h2><p>Choose the exact pages and actions this account can access.</p><div class="op-user" id="opUserLabel">Loading account...</div></div><button class="op-btn" id="opBackBtn">← Back to Manage Admins</button></header>
 <div id="opMessage"></div><div id="opGuestNote" class="op-note" hidden>Guest accounts are Read Only. All create, edit, delete, restore and other write permissions are automatically disabled.</div>
 <div class="op-tools"><strong>Permission Settings</strong><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="op-btn" id="opSelectAll">Select All</button><button class="op-btn" id="opClearAll">Clear All</button></div></div>
 <div id="opGroups" class="op-groups"><div class="op-loading">Loading permissions...</div></div>
 <div class="op-footer"><button class="op-btn" id="opCancelBtn">Cancel</button><button class="op-btn primary" id="opSaveBtn" disabled>Save Permissions</button></div>
</div><div class="op-toast" id="opToast"></div>
<script>
(function(){
'use strict';
const auth=window.oneOnlineAuth;
const root=document.querySelector('.op-page');
const $=id=>document.getElementById(id);
function toast(msg){const t=$('opToast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function goBack(){if(typeof window.loadPage==='function')window.loadPage('manage-admins');else $('opMessage').innerHTML='<div class="op-error">Cannot return: index.html page loader was not found.</div>'}
$('opBackBtn').addEventListener('click',goBack);$('opCancelBtn').addEventListener('click',goBack);
if(!auth||!auth.api||!auth.getRole){root.innerHTML='<div class="op-error">Login connection not found. Please reload and sign in again.</div>';return}
if(String(auth.getRole()).toUpperCase()!=='SUPER_ADMIN'){root.innerHTML='<div class="op-error">Access denied. Only Super Admin can manage account permissions.</div>';return}
let target;try{target=JSON.parse(sessionStorage.getItem('one_online_permission_target')||'null')}catch(e){}
if(!target||!target.id){root.innerHTML='<div class="op-error">No account selected. Return to Manage Admins and click the permission icon for an account.</div>';return}
$('opUserLabel').textContent=(target.name||target.username||'Account')+' · '+(target.role||'');
const isGuest=String(target.role).toUpperCase()==='GUEST';$('opGuestNote').hidden=!isGuest;
let catalog=[],permissions={},busy=false;
function unwrap(r){return r&&(r.data||r.result||r)||{}}
async function api(action,data){const r=await auth.api(action,data||{});const d=unwrap(r);if(r&&(r.success===false||r.ok===false||String(r.status||'').toLowerCase()==='error'||d.success===false))throw new Error(r.message||r.error||d.message||d.error||'Request failed');return d}
function safe(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const groups={};catalog.forEach(p=>{const g=p.group||'Other';(groups[g]||(groups[g]=[])).push(p)});$('opGroups').innerHTML=Object.keys(groups).map((group,gi)=>{const items=groups[group];const allChecked=items.length&&items.every(p=>permissions[p.key]===true||(isGuest&&p.type!=='view'));return `<section class="op-group"><div class="op-group-head"><div><strong>${safe(group)}</strong><small>${items.length} permissions</small></div><button class="op-btn op-group-toggle" type="button" data-group="${gi}">${allChecked?'Clear Group':'Select Group'}</button></div><div class="op-grid">${items.map(p=>{const forced=isGuest&&p.type!=='view';return `<label class="op-item"><input type="checkbox" data-key="${safe(p.key)}" ${permissions[p.key]===true&&!forced?'checked':''} ${forced?'disabled':''}><span>${safe(p.label)}${forced?'<small>Disabled for Guest (Read Only)</small>':''}</span></label>`}).join('')}</div></section>`}).join('');}
function collect(){document.querySelectorAll('#opGroups input[data-key]').forEach(i=>permissions[i.dataset.key]=i.checked===true);if(isGuest)catalog.filter(p=>p.type!=='view').forEach(p=>permissions[p.key]=false)}
async function load(){try{const d=await api('getUserPermissions',{userId:target.id,id:target.id});catalog=Array.isArray(d.catalog)?d.catalog:[];permissions=Object.assign({},d.permissions||{});if(!catalog.length)throw new Error('Permission catalog is empty. Check the deployed Code.gs version.');render();$('opSaveBtn').disabled=false}catch(e){$('opGroups').innerHTML='<div class="op-error">'+safe(e.message||'Could not load permissions.')+'</div>';}}
$('opGroups').addEventListener('click',e=>{const b=e.target.closest('.op-group-toggle');if(!b)return;const groupNames=Object.keys(catalog.reduce((o,p)=>(o[p.group||'Other']=1,o),{}));const items=catalog.filter(p=>(p.group||'Other')===groupNames[Number(b.dataset.group)]);const checks=items.map(p=>document.querySelector('#opGroups input[data-key="'+CSS.escape(p.key)+'"]')).filter(Boolean);const should=checks.some(i=>!i.checked&&!i.disabled);checks.forEach(i=>{if(!i.disabled)i.checked=should});collect();b.textContent=should?'Clear Group':'Select Group'});
$('opSelectAll').addEventListener('click',()=>{document.querySelectorAll('#opGroups input:not(:disabled)').forEach(i=>i.checked=true);collect();render()});$('opClearAll').addEventListener('click',()=>{document.querySelectorAll('#opGroups input:not(:disabled)').forEach(i=>i.checked=false);collect();render()});
$('opGroups').addEventListener('change',e=>{if(e.target.matches('input[data-key]'))collect()});
$('opSaveBtn').addEventListener('click',async()=>{if(busy)return;collect();busy=true;const b=$('opSaveBtn');b.disabled=true;b.textContent='Saving...';try{await api('saveUserPermissions',{userId:target.id,id:target.id,permissions});toast('Permissions saved successfully');sessionStorage.removeItem('one_online_permission_target');setTimeout(goBack,500)}catch(e){$('opMessage').innerHTML='<div class="op-error">'+safe(e.message||'Could not save permissions.')+'</div>';b.disabled=false}finally{busy=false;b.textContent='Save Permissions'}});
load();
})();
</script></body></html>
