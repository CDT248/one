
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE ONLINE - Add Customer</title>
<style>
#addCustomerPage {
  --ac-primary:var(--primary,#0d9488);
  --ac-text:var(--text,#172033);
  --ac-muted:var(--muted,#7b8495);
  --ac-card:var(--card,#fff);
  --ac-border:var(--border,#e5e7eb);
  color:var(--ac-text);
  font-family:inherit;
}
#addCustomerPage * {box-sizing:border-box}
#addCustomerPage .ac-head {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
#addCustomerPage h2 {font-size:22px;margin:0 0 5px}
#addCustomerPage .muted {color:var(--ac-muted);font-size:13px}
#addCustomerPage .ac-card {background:var(--ac-card);border:1px solid var(--ac-border);border-radius:14px;padding:20px;box-shadow:var(--shadow,0 4px 18px #00000008)}
#addCustomerPage .ac-section {font-size:15px;font-weight:700;margin:18px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--ac-border)}
#addCustomerPage .ac-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
#addCustomerPage label {display:block;font-size:12px;font-weight:600;margin-bottom:6px}
#addCustomerPage input,#addCustomerPage select,#addCustomerPage textarea {
  width:100%;min-height:42px;border:1px solid var(--ac-border);border-radius:9px;
  padding:10px 11px;background:var(--input-bg,var(--ac-card));color:var(--ac-text);
  font:inherit;font-size:13px;outline:none;
}
#addCustomerPage input:focus,#addCustomerPage select:focus,#addCustomerPage textarea:focus {border-color:var(--ac-primary)}
#addCustomerPage textarea {min-height:72px;resize:vertical}
#addCustomerPage .ac-actions {display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
#addCustomerPage button {border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}
#addCustomerPage .primary {background:var(--ac-primary);color:#fff}
#addCustomerPage .secondary {background:var(--hover,#eef2f7);color:var(--ac-text)}
#addCustomerPage .status {display:none;padding:11px 13px;border-radius:9px;margin-bottom:14px;font-size:13px}
#addCustomerPage .status.ok {display:block;background:#dcfce7;color:#166534}
#addCustomerPage .status.err {display:block;background:#fee2e2;color:#991b1b}
@media(max-width:800px){#addCustomerPage .ac-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){#addCustomerPage .ac-grid{grid-template-columns:1fr}#addCustomerPage .ac-card{padding:14px}}
</style>
</head>
<body>
<div id="addCustomerPage">
  <div class="ac-head">
    <div>
      <h2>Add New Customer</h2>
      <div class="muted">Create a new customer record in ONE ONLINE</div>
    </div>
  </div>

  <div class="ac-card">
    <div id="acStatus" class="status"></div>

    <form id="acForm">
      <div class="ac-section">Customer Information</div>
      <div class="ac-grid">
        <div><label>Customer Name *</label><input name="name" required placeholder="Customer name"></div>
        <div><label>Customer IP *</label><input name="ip" required placeholder="Example: LRSN014"></div>
        <div><label>Phone</label><input name="phone" placeholder="Phone number"></div>
        <div><label>Email</label><input name="email" type="email" placeholder="Email address"></div>
        <div><label>Area</label><input name="area" placeholder="Area"></div>
        <div><label>Location</label><input name="location" placeholder="Location"></div>
        <div><label>Address</label><input name="address" placeholder="Full address"></div>
        <div><label>ONU</label><input name="onu" placeholder="ONU details"></div>
        <div><label>Fiber</label><input name="fiber" placeholder="Fiber details"></div>
        <div><label>Create Date</label><input name="createDate" type="date" id="acCreateDate"></div>
      </div>

      <div class="ac-section">Billing Information</div>
      <div class="ac-grid">
        <div><label>Customer Bill (৳)</label><input name="customerBill" type="number" min="0" step="0.01" value="0"></div>
        <div><label>IP Bill (৳)</label><input name="ipBill" type="number" min="0" step="0.01" value="0"></div>
        <div><label>Current Due (৳)</label><input name="dueAmount" type="number" min="0" step="0.01" value="0"></div>
        <div><label>Billing Date</label><input name="billingDate" type="date"></div>
        <div><label>Bill Trigger</label>
          <select name="billTrigger"><option value="ON">ON</option><option value="OFF">OFF</option></select>
        </div>
        <div><label>IP Bill Trigger</label>
          <select name="ipBillTrigger"><option value="OFF">OFF</option><option value="ON">ON</option></select>
        </div>
        <div><label>Collection Status</label>
          <select name="collect"><option value="Due">Due</option><option value="Collected">Collected</option></select>
        </div>
        <div><label>Reason</label><input name="reason" placeholder="Optional reason"></div>
      </div>

      <div class="ac-actions">
        <button type="reset" class="secondary">Reset</button>
        <button type="submit" class="primary" id="acSubmit">Save Customer</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const API_URL = "https://script.google.com/macros/s/AKfycbxrhL_45Ey9QHICYzpNdsYRapqRZv36fzyEORs02MCnlAuju8yF-s5bDOfxY_l5qNrG/exec";
  const TOKEN_KEY = "one_online_customer_token";
  const PARENT_TOKEN_KEY = "one_online_session_token";
  const root = document.getElementById("addCustomerPage");
  if (!root || root.dataset.ready) return;
  root.dataset.ready = "1";

  const form = root.querySelector("#acForm");
  const statusBox = root.querySelector("#acStatus");
  const submitBtn = root.querySelector("#acSubmit");
  root.querySelector("#acCreateDate").value = new Date().toISOString().slice(0,10);

  function show(message, type){
    statusBox.textContent = message;
    statusBox.className = "status " + (type || "ok");
  }

  function getToken(){
    return sessionStorage.getItem(TOKEN_KEY) ||
           sessionStorage.getItem(PARENT_TOKEN_KEY) || "";
  }

  async function login(){
    let token = getToken();
    if (token) return token;

    const password = prompt("ONE ONLINE API Password দিন:");
    if (password === null || !password.trim()) throw new Error("Login cancelled.");

    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"login",password:password})
    });

    const data = await res.json();
    if (!data.success) throw new Error(data.message || "Login failed.");

    sessionStorage.setItem(TOKEN_KEY,data.token);
    return data.token;
  }

  form.addEventListener("submit",async function(e){
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";

    try{
      const token = await login();
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());

      data.action = "add";
      data.token = token;

      ["customerBill","ipBill","dueAmount"].forEach(k=>{
        data[k] = Number(data[k] || 0);
      });

      const response = await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(data)
      });

      const result = await response.json();

      if (!result.success){
        if(result.unauthorized) sessionStorage.removeItem(TOKEN_KEY);
        throw new Error(result.message || "Unable to save customer.");
      }

      show("Customer added successfully. Customer IP: " + data.ip,"ok");
      form.reset();
      root.querySelector("#acCreateDate").value = new Date().toISOString().slice(0,10);

      document.dispatchEvent(new CustomEvent("oneonline:customer-added",{detail:result}));

    }catch(err){
      show(err.message || "Something went wrong.","err");
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = "Save Customer";
    }
  });
})();
</script>
</body>
</html>
