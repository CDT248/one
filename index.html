
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE ONLINE | Management System</title>

<style>
/* ===================================
   ONE ONLINE - MAIN INDEX
=================================== */

:root {
  --primary:#087f5b;
  --primary2:#0ca678;
  --bg:#f5f7fb;
  --card:#ffffff;
  --sidebar:#ffffff;
  --text:#172033;
  --muted:#718096;
  --border:#e8edf3;
  --hover:#e8f7ef;
  --shadow:0 4px 18px rgba(0,0,0,.05);
  --header:#ffffff;
}

body.dark {
  --primary:#34d399;
  --primary2:#10b981;
  --bg:#111827;
  --card:#1f2937;
  --sidebar:#17212f;
  --text:#f1f5f9;
  --muted:#a1adbd;
  --border:#334155;
  --hover:#263d3a;
  --shadow:0 4px 18px rgba(0,0,0,.20);
  --header:#17212f;
}

body.funny {
  --primary:#ec4899;
  --primary2:#8b5cf6;
  --bg:#fff0f7;
  --card:#ffffff;
  --sidebar:#fff8fc;
  --text:#4a235a;
  --muted:#986c9c;
  --border:#f4c6e0;
  --hover:#ffe0f0;
  --shadow:0 5px 20px rgba(236,72,153,.10);
  --header:#fff8fc;
}

* {
  box-sizing:border-box;
}

html,body {
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .25s,color .25s;
}

button {
  font-family:inherit;
}

/* APP LAYOUT */

.app {
  min-height:100vh;
}

.sidebar {
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:255px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  z-index:1000;
  display:flex;
  flex-direction:column;
  transition:background .25s,transform .3s;
}

.brand {
  height:75px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.brand-logo {
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#087f5b,#12b886);
  color:white;
  font-size:19px;
  font-weight:900;
  border-radius:12px;
}

.brand-info strong {
  display:block;
  font-size:17px;
  letter-spacing:.5px;
}

.brand-info small {
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
}

.sidebar-content {
  flex:1;
  overflow-y:auto;
  padding:17px 12px;
}

.nav-label {
  font-size:10px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:1.4px;
  padding:10px 12px;
}

.nav-item {
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:12px 13px;
  border-radius:9px;
  font-size:13px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  margin-bottom:4px;
  transition:.2s;
}

.nav-item:hover {
  background:var(--hover);
  color:var(--primary);
}

.nav-item.active {
  color:white;
  background:linear-gradient(135deg,#087f5b,#0ca678);
  box-shadow:0 4px 12px #087f5b25;
}

.nav-icon {
  width:21px;
  text-align:center;
  font-size:16px;
}

.sidebar-bottom {
  padding:14px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:10px;
  text-align:center;
}

/* MAIN AREA */

.main {
  margin-left:255px;
  min-height:100vh;
  transition:margin .3s;
}

.topbar {
  position:sticky;
  top:0;
  z-index:500;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:var(--header);
  border-bottom:1px solid var(--border);
  gap:15px;
}

.top-left {
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.menu-toggle {
  display:none;
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  cursor:pointer;
  font-size:19px;
}

.page-heading h2 {
  margin:0;
  font-size:17px;
  font-weight:750;
}

.page-heading p {
  margin:5px 0 0;
  font-size:11px;
  color:var(--muted);
}

.top-right {
  display:flex;
  align-items:center;
  gap:12px;
}

.theme-select-wrap {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--bg);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:10px;
}

.theme-select-wrap span {
  font-size:16px;
}

.theme-select {
  border:0;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  padding:5px 2px;
}

.theme-select option {
  background:var(--card);
  color:var(--text);
}

.profile {
  display:flex;
  align-items:center;
  gap:9px;
  padding-left:12px;
  border-left:1px solid var(--border);
}

.profile-avatar {
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#087f5b,#12b886);
  font-size:12px;
}

.profile-info strong {
  display:block;
  font-size:12px;
}

.profile-info small {
  color:var(--muted);
  font-size:10px;
}

/* PAGE CONTENT */

#pageContainer {
  min-height:calc(100vh - 75px);
  background:var(--bg);
  position:relative;
}

.loading-screen {
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  color:var(--muted);
  font-size:13px;
}

.loader {
  width:35px;
  height:35px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin {
  to {transform:rotate(360deg);}
}

.error-box {
  margin:25px;
  padding:25px;
  border:1px solid #fecaca;
  background:#fff1f2;
  color:#b91c1c;
  border-radius:12px;
}

.error-box h3 {
  margin-top:0;
}

.error-box button {
  border:0;
  background:#b91c1c;
  color:white;
  padding:9px 16px;
  border-radius:7px;
  cursor:pointer;
}

/* MOBILE OVERLAY */

#mobileOverlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:900;
}

#mobileOverlay.show {
  display:block;
}

/* FUNNY MODE */

body.funny .brand-logo {
  background:linear-gradient(135deg,#ec4899,#8b5cf6,#f59e0b);
  animation:funnyLogo 3s ease-in-out infinite;
}

@keyframes funnyLogo {
  0%,100% {transform:rotate(0deg);}
  25% {transform:rotate(-7deg);}
  75% {transform:rotate(7deg);}
}

body.funny .nav-item.active {
  background:linear-gradient(120deg,#ec4899,#8b5cf6);
  box-shadow:0 5px 15px #ec489944;
}

body.funny .profile-avatar {
  background:linear-gradient(135deg,#ec4899,#8b5cf6);
}

body.funny .theme-select-wrap {
  border-color:#f3b4d6;
  background:#fff0f7;
}

body.funny .funny-decorations {
  display:block;
}

.funny-decorations {
  display:none;
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1500;
  overflow:hidden;
}

.funny-emoji {
  position:absolute;
  font-size:23px;
  opacity:.16;
  animation:emojiFloat 7s ease-in-out infinite;
}

.funny-emoji:nth-child(1) {top:15%;right:7%;animation-delay:0s;}
.funny-emoji:nth-child(2) {top:35%;right:3%;animation-delay:1s;}
.funny-emoji:nth-child(3) {bottom:18%;right:6%;animation-delay:2s;}
.funny-emoji:nth-child(4) {top:70%;left:27%;animation-delay:3s;}
.funny-emoji:nth-child(5) {top:12%;left:35%;animation-delay:1.5s;}
.funny-emoji:nth-child(6) {bottom:8%;left:55%;animation-delay:2.5s;}
.funny-emoji:nth-child(7) {top:50%;right:20%;animation-delay:3.5s;}

@keyframes emojiFloat {
  0%,100% {transform:translateY(0) rotate(-8deg);}
  50% {transform:translateY(-17px) rotate(10deg);}
}

body.funny .page-heading h2::after {
  content:" 🤪";
}

body.funny .nav-item:hover {
  transform:translateX(3px);
}

/* MOBILE */

@media(max-width:900px) {
  .sidebar {
    transform:translateX(-100%);
  }

  .sidebar.open {
    transform:translateX(0);
  }

  .main {
    margin-left:0;
  }

  .menu-toggle {
    display:block;
  }

  .topbar {
    padding:0 15px;
  }
}

@media(max-width:600px) {
  .topbar {
    height:65px;
  }

  .page-heading h2 {
    font-size:14px;
  }

  .page-heading p {
    display:none;
  }

  .profile-info {
    display:none;
  }

  .profile {
    padding-left:7px;
  }

  .theme-select-wrap {
    gap:4px;
    padding:5px 7px;
  }

  .theme-select {
    max-width:100px;
    font-size:10px;
  }

  #pageContainer {
    min-height:calc(100vh - 65px);
  }
}
</style>
</head>

<script>
/* ===================================
   ONE ONLINE - MAIN JAVASCRIPT
=================================== */

(function () {
"use strict";

/* PAGE CONFIGURATION */

const PAGE_CONFIG = {
  "dashboard": {
    file:"dashboard.html",
    title:"Dashboard",
    breadcrumb:"Home / Dashboard"
  },

  "total-customer": {
    file:"total-customer.html",
    title:"Total Customer",
    breadcrumb:"Home / Customers / Total Customer"
  },

  "add-customer": {
    file:"add-customer.html",
    title:"Add Customer",
    breadcrumb:"Home / Customers / Add Customer"
  },

  "due-customer": {
    file:"due-customer.html",
    title:"Due Customer",
    breadcrumb:"Home / Customers / Due Customer"
  },

  "deleted-customer": {
    file:"deleted-customer.html",
    title:"Deleted Customer",
    breadcrumb:"Home / Customers / Deleted Customer"
  },

  "customer-history": {
    file:"customer-history.html",
    title:"Customer History",
    breadcrumb:"Home / Customers / Customer History"
  },

  "email-settings": {
    file:"email-settings.html",
    title:"Email Settings",
    breadcrumb:"Home / Email / Email Settings"
  },

  "send-email": {
    file:"send-email.html",
    title:"Send Email",
    breadcrumb:"Home / Email / Send Email"
  },

  "email-history": {
    file:"email-history.html",
    title:"Email History",
    breadcrumb:"Home / Email / Email History"
  },

  "email-template": {
    file:"email-template.html",
    title:"Email Template",
    breadcrumb:"Home / Email / Email Template"
  },

  "spend-add": {
    file:"spend-add.html",
    title:"Spend Add",
    breadcrumb:"Home / Spend / Spend Add"
  },

  "spend-history": {
    file:"spend-history.html",
    title:"Spend History",
    breadcrumb:"Home / Spend / Spend History"
  },

  "deleted-spend": {
    file:"deleted-spend.html",
    title:"Deleted Spend",
    breadcrumb:"Home / Spend / Deleted Spend"
  }
};

/* GLOBAL ELEMENTS */

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("mobileOverlay");
const pageContainer = document.getElementById("pageContainer");
const pageTitle = document.getElementById("pageTitle");
const pageBreadcrumb = document.getElementById("pageBreadcrumb");
const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");

let currentPage = "dashboard";
let pageLoadController = null;
let pageLoadNumber = 0;

/* ===================================
   THEME SYSTEM - 3 MODES
=================================== */

const THEME_KEY = "one_online_theme";

function applyTheme(theme) {

  const validThemes = ["light","dark","funny"];

  if (!validThemes.includes(theme)) {
    theme = "light";
  }

  document.body.classList.remove("dark","funny");

  if (theme === "dark") {
    document.body.classList.add("dark");
    themeIcon.textContent = "🌙";
  }

  else if (theme === "funny") {
    document.body.classList.add("funny");
    themeIcon.textContent = "🤪";
  }

  else {
    themeIcon.textContent = "☀️";
  }

  themeToggle.value = theme;

  try {
    localStorage.setItem(THEME_KEY,theme);
  } catch(error) {
    console.warn("Theme storage unavailable",error);
  }

  window.currentTheme = theme;
}

let savedTheme = "light";

try {
  savedTheme = localStorage.getItem(THEME_KEY) || "light";
} catch(error) {}

applyTheme(savedTheme);

themeToggle.addEventListener("change",function () {
  applyTheme(this.value);
});

/* ===================================
   MOBILE SIDEBAR
=================================== */

function openSidebar() {
  sidebar.classList.add("open");
  overlay.classList.add("show");
}

function closeSidebar() {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

document.getElementById("menuToggle").addEventListener("click",function () {
  if (sidebar.classList.contains("open")) {
    closeSidebar();
  } else {
    openSidebar();
  }
});

overlay.addEventListener("click",closeSidebar);

/* ===================================
   ACTIVE MENU
=================================== */

function updateActiveMenu(page) {
  document.querySelectorAll(".nav-item[data-page]").forEach(function(item) {
    item.classList.toggle("active",item.dataset.page === page);
  });
}

/* ===================================
   PAGE HEADER
=================================== */

function updatePageHeader(page) {
  const config = PAGE_CONFIG[page];

  if (!config) return;

  pageTitle.textContent = config.title;
  pageBreadcrumb.textContent = config.breadcrumb;

  document.title = "ONE ONLINE | " + config.title;
}

/* ===================================
   CSS LOADER AND SCOPING
=================================== */

function escapeRegExp(value) {
  return value.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function scopeChildCSS(cssText) {

  const root = "#pageContainer";

  // Preserve @media and @supports while scoping normal selectors.
  return cssText.replace(/(^|})\s*([^@{}][^{}]*)\{/g,function(match,before,selectors) {

    const scoped = selectors.split(",").map(function(selector) {
      selector = selector.trim();

      if (!selector) return selector;

      if (
        selector.startsWith("@") ||
        selector.includes("keyframes") ||
        selector.startsWith("from") ||
        selector.startsWith("to")
      ) {
        return selector;
      }

      if (selector.startsWith("html") || selector.startsWith("body")) {
        return root + " " + selector.replace(/^(html|body)/,"").trim();
      }

      return root + " " + selector;
    }).join(", ");

    return before + "\n" + scoped + " {";
  });
}

async function loadPageStyles(doc,pageFile) {

  const oldStyles = document.querySelectorAll("[data-child-page-style]");

  oldStyles.forEach(function(style) {
    style.remove();
  });

  // Inline CSS
  doc.querySelectorAll("style").forEach(function(styleTag,index) {

    const style = document.createElement("style");

    style.setAttribute("data-child-page-style",pageFile);
    style.textContent = scopeChildCSS(styleTag.textContent);

    document.head.appendChild(style);
  });

  // External CSS
  const links = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));

  for (const link of links) {

    const styleLink = document.createElement("link");

    styleLink.rel = "stylesheet";
    styleLink.href = new URL(link.getAttribute("href"),new URL(pageFile,location.href)).href;
    styleLink.setAttribute("data-child-page-style",pageFile);

    document.head.appendChild(styleLink);
  }
}

/* ===================================
   CHILD PAGE SCRIPT EXECUTION
=================================== */

async function executePageScripts(doc,pageFile) {

  const scripts = Array.from(doc.querySelectorAll("script"));

  for (const oldScript of scripts) {

    const script = document.createElement("script");

    Array.from(oldScript.attributes).forEach(function(attribute) {
      script.setAttribute(attribute.name,attribute.value);
    });

    if (oldScript.src) {
      script.src = new URL(oldScript.getAttribute("src"),new URL(pageFile,location.href)).href;
    } else {
      script.textContent = oldScript.textContent;
    }

    // Wait for external scripts before continuing.
    if (script.src) {
      await new Promise(function(resolve) {
        script.onload = resolve;
        script.onerror = resolve;
        document.body.appendChild(script);
      });
    } else {
      document.body.appendChild(script);
    }
  }
}

/* ===================================
   LOAD PAGE
=================================== */

async function loadPage(page,addHistory) {

  if (addHistory === undefined) addHistory = true;

  const config = PAGE_CONFIG[page];

  if (!config) {
    console.error("Unknown page:",page);
    return;
  }

  const thisLoad = ++pageLoadNumber;

  // Cancel previous pending request
  if (pageLoadController) {
    pageLoadController.abort();
  }

  pageLoadController = new AbortController();

  currentPage = page;
  window.currentPage = page;

  updateActiveMenu(page);
  updatePageHeader(page);
  closeSidebar();

  if (addHistory) {
    const newUrl = "#" + page;

    if (location.hash !== newUrl) {
      history.pushState({page:page},"",newUrl);
    }
  }

  pageContainer.innerHTML = `
    <div class="loading-screen">
      <div class="loader"></div>
      Loading ${config.title}...
    </div>
  `;

  try {

    const response = await fetch("./" + config.file,{
      cache:"no-cache",
      signal:pageLoadController.signal
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status + " - " + config.file);
    }

    const html = await response.text();

    if (thisLoad !== pageLoadNumber) return;

    const parser = new DOMParser();
    const doc = parser.parseFromString(html,"text/html");

    // Load child styles
    await loadPageStyles(doc,config.file);

    if (thisLoad !== pageLoadNumber) return;

    // Insert child body
    pageContainer.innerHTML = doc.body ? doc.body.innerHTML : html;

    // Execute child scripts
    await executePageScripts(doc,config.file);

    if (thisLoad !== pageLoadNumber) return;

    // Page loaded event for child-page compatibility
    window.dispatchEvent(new CustomEvent("oneonline:page-loaded",{
      detail:{page:page,file:config.file}
    }));

  } catch(error) {

    if (error.name === "AbortError") return;

    console.error("Page loading error:",error);

    pageContainer.innerHTML = `
      <div class="error-box">
        <h3>⚠️ Unable to Load Page</h3>
        <p>
          Could not load <strong>${config.file}</strong>.
          Please check that the HTML file exists in your GitHub root folder.
        </p>
        <p style="font-size:12px">${String(error.message || error)}</p>
        <button onclick="window.loadPage('${page}',false)">
          Try Again
        </button>
      </div>
    `;
  }
}

/* ===================================
   GLOBAL PAGE FUNCTION
=================================== */

window.loadPage = loadPage;

/* ===================================
   SIDEBAR NAVIGATION
=================================== */

document.querySelectorAll(".nav-item[data-page]").forEach(function(item) {

  item.addEventListener("click",function() {
    loadPage(this.dataset.page,true);
  });

});

/* ===================================
   HASH ROUTING
=================================== */

function getPageFromHash() {

  const page = location.hash.replace("#","").trim();

  if (PAGE_CONFIG[page]) {
    return page;
  }

  return "dashboard";
}

window.addEventListener("popstate",function() {
  loadPage(getPageFromHash(),false);
});

window.addEventListener("hashchange",function() {
  const page = getPageFromHash();

  if (page !== currentPage) {
    loadPage(page,false);
  }
});

/* ===================================
   INITIAL PAGE
=================================== */

loadPage(getPageFromHash(),false);

})();
</script>
