
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE ONLINE - Total Customer</title>
<style>
#totalCustomerPage{--tc-primary:var(--primary,#0d9488);--tc-text:var(--text,#172033);--tc-muted:var(--muted,#7b8495);--tc-card:var(--card,#fff);--tc-border:var(--border,#e5e7eb);color:var(--tc-text);font-family:inherit}
#totalCustomerPage *{box-sizing:border-box}
#totalCustomerPage .tc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#totalCustomerPage h2{font-size:22px;margin:0 0 4px}
#totalCustomerPage .muted{font-size:13px;color:var(--tc-muted)}
#totalCustomerPage .tc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
#totalCustomerPage .tc-stat{background:var(--tc-card);border:1px solid var(--tc-border);border-radius:12px;padding:14px}
#totalCustomerPage .tc-stat small{display:block;color:var(--tc-muted);font-size:12px}
#totalCustomerPage .tc-stat strong{display:block;font-size:21px;margin-top:6px}
#totalCustomerPage .tc-panel{background:var(--tc-card);border:1px solid var(--tc-border);border-radius:13px;overflow:hidden}
#totalCustomerPage .tc-toolbar{display:flex;gap:9px;align-items:center;padding:13px;border-bottom:1px solid var(--tc-border);flex-wrap:wrap}
#totalCustomerPage input,#totalCustomerPage select{background:var(--input-bg,var(--tc-card));color:var(--tc-text);border:1px solid var(--tc-border);border-radius:8px;padding:10px;font:inherit;font-size:13px;min-height:39px}
#totalCustomerPage .tc-search{flex:1;min-width:180px}
#totalCustomerPage button{border:0;border-radius:8px;padding:9px 12px;font-weight:650;cursor:pointer;font-size:12px}
#totalCustomerPage button:disabled{opacity:.55;cursor:wait}
#totalCustomerPage .primary{background:var(--tc-primary);color:#fff}
#totalCustomerPage .soft{background:var(--hover,#eef2f7);color:var(--tc-text)}
#totalCustomerPage .danger{background:#fee2e2;color:#991b1b}
#totalCustomerPage .tc-table-wrap{width:100%;overflow:auto}
#totalCustomerPage table{width:100%;border-collapse:collapse;min-width:940px}
#totalCustomerPage th,#totalCustomerPage td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--tc-border);font-size:12px;white-space:nowrap}
#totalCustomerPage th{background:var(--table-head,var(--hover,#f7f8fa));font-weight:700}
#totalCustomerPage .tc-actions{display:flex;gap:5px;flex-wrap:wrap}
#totalCustomerPage .tc-actions button{padding:7px 9px}
#totalCustomerPage .pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700}
#totalCustomerPage .pill.due{background:#fef3c7;color:#92400e}
#totalCustomerPage .pill.paid{background:#dcfce7;color:#166534}
#totalCustomerPage .tc-empty{text-align:center;padding:35px;color:var(--tc-muted)}
#totalCustomerPage .tc-message{padding:11px 14px;font-size:13px;display:none}
#totalCustomerPage .tc-message.show{display:block}
#totalCustomerPage .tc-message.err{background:#fee2e2;color:#991b1b}
#totalCustomerPage .tc-message.ok{background:#dcfce7;color:#166534}
#totalCustomerPage .tc-modal{position:fixed;inset:0;background:#0008;z-index:9999;display:none;align-items:center;justify-content:center;padding:15px}
#totalCustomerPage .tc-modal.open{display:flex}
#totalCustomerPage .tc-dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--tc-card);color:var(--tc-text);border-radius:14px;padding:19px;box-shadow:0 15px 50px #0003}
#totalCustomerPage .tc-dialog h3{margin:0 0 15px;font-size:18px}
#totalCustomerPage .tc-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#totalCustomerPage .tc-field label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}
#totalCustomerPage .tc-field input,#totalCustomerPage .tc-field select{width:100%}
#totalCustomerPage .tc-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#totalCustomerPage .tc-pages{display:flex;align-items:center;justify-content:space-between;padding:12px;font-size:12px;color:var(--tc-muted)}
@media(max-width:700px){#totalCustomerPage .tc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:450px){#totalCustomerPage .tc-stats{gap:7px}#totalCustomerPage .tc-stat{padding:10px}#totalCustomerPage .tc-stat strong{font-size:18px}#totalCustomerPage .tc-form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="totalCustomerPage">
  <div class="tc-head">
    <div>
      <h2>Total Customers</h2>
      <div class="muted">Manage customers, bills, payments and renewals</div>
    </div>
    <button class="primary" id="tcAdd">+ Add Customer</button>
  </div>

  <div class="tc-stats">
    <div class="tc-stat"><small>Total Customers</small><strong id="tcTotal">0</strong></div>
    <div class="tc-stat"><small>Collected</small><strong id="tcCollected">0</strong></div>
    <div class="tc-stat"><small>Due Customers</small><strong id="tcDueCount">0</strong></div>
    <div class="tc-stat"><small>Total Due Amount</small><strong id="tcDueAmount">৳0</strong></div>
  </div>

  <div class="tc-panel">
    <div class="tc-toolbar">
      <input id="tcSearch" class="tc-search" placeholder="Search name, IP, phone, area...">
      <select id="tcFilter">
        <option value="all">All Customers</option>
        <option value="due">Due Customers</option>
        <option value="collected">Collected</option>
      </select>
      <button class="soft" id="tcRefresh">Refresh</button>
    </div>
    <div id="tcMessage" class="tc-message"></div>
    <div class="tc-table-wrap">
      <table>
        <thead>
          <tr>
            <th>SI</th><th>Customer</th><th>IP Address</th><th>Phone</th>
            <th>Area</th><th>Bill</th><th>Due Amount</th>
            <th>Billing Date</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tcRows">
          <tr><td colspan="10" class="tc-empty">Loading customers...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="tc-pages"><span id="tcCount">0 customers</span><span>ONE ONLINE</span></div>
  </div>

  <div class="tc-modal" id="tcEditModal">
    <div class="tc-dialog">
      <h3>Edit Customer</h3>
      <form id="tcEditForm">
        <input type="hidden" name="oldIp">
        <div class="tc-form-grid" id="tcEditFields"></div>
        <div class="tc-modal-actions">
          <button type="button" class="soft" data-close="tcEditModal">Cancel</button>
          <button type="submit" class="primary" id="tcEditSave">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div class="tc-modal" id="tcBillModal">
    <div class="tc-dialog">
      <h3 id="tcBillTitle">Bill / Payment</h3>
      <form id="tcBillForm">
        <input type="hidden" name="ip">
        <div class="tc-field"><label>Action</label>
          <select name="mode" id="tcBillMode">
            <option value="due">Add Bill / Due</option>
            <option value="collect">Collect Payment</option>
          </select>
        </div>
        <div class="tc-field" style="margin-top:12px"><label>Amount (৳) *</label><input name="amount" type="number" min="0.01" step="0.01" required></div>
        <div id="tcDueFields">
          <div class="tc-field" style="margin-top:12px"><label>Due From</label>
            <select name="dueFrom"><option>Bill</option><option>Previous Due</option><option>IP Bill</option><option>Other</option></select>
          </div>
          <div class="tc-field" style="margin-top:12px"><label>Due Reason</label><input name="dueReason" placeholder="Why is this due?"></div>
        </div>
        <div class="tc-field" style="margin-top:12px"><label><input type="checkbox" name="renewBilling" value="true" style="width:auto;min-height:0"> Also renew billing date by one month after collection</label></div>
        <div class="tc-modal-actions">
          <button type="button" class="soft" data-close="tcBillModal">Cancel</button>
          <button type="submit" class="primary" id="tcBillSave">Submit</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
(function(){
  const API_URL = "https://script.google.com/macros/s/AKfycbxrhL_45Ey9QHICYzpNdsYRapqRZv36fzyEORs02MCnlAuju8yF-s5bDOfxY_l5qNrG/exec";
  const TOKEN_KEY = "one_online_customer_token";
  const PARENT_TOKEN_KEY = "one_online_session_token";
  const root = document.getElementById("totalCustomerPage");
  if(!root || root.dataset.ready) return;
  root.dataset.ready = "1";

  const $ = id => root.querySelector("#"+id);
  let customers = [];
  let activeCustomer = null;

  function token(){
    return sessionStorage.getItem(TOKEN_KEY) ||
           sessionStorage.getItem(PARENT_TOKEN_KEY) || "";
  }

  async function login(){
    let t = token();
    if(t) return t;

    const password = prompt("ONE ONLINE API Password দিন:");
    if(password === null || !password.trim()) throw new Error("Login cancelled.");

    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"login",password})
    });
    const data = await res.json();

    if(!data.success) throw new Error(data.message || "Login failed.");
    sessionStorage.setItem(TOKEN_KEY,data.token);
    return data.token;
  }

  function jsonp(url){
    return new Promise((resolve,reject)=>{
      const callback = "oneOnlineCallback_" + Date.now() + "_" + Math.floor(Math.random()*10000);
      const script = document.createElement("script");
      const timer = setTimeout(()=>{
        cleanup();
        reject(new Error("API response timeout."));
      },20000);

      function cleanup(){
        clearTimeout(timer);
        delete window[callback];
        script.remove();
      }

      window[callback] = data=>{
        cleanup();
        resolve(data);
      };

      script.onerror = ()=>{
        cleanup();
        reject(new Error("Unable to connect to Customer API."));
      };

      script.src = url + (url.includes("?") ? "&" : "?") +
        "callback=" + callback + "&_=" + Date.now();

      document.body.appendChild(script);
    });
  }

  async function get(action){
    const t = await login();
    const data = await jsonp(API_URL+"?action="+encodeURIComponent(action)+"&token="+encodeURIComponent(t));
    if(!data.success){
      if(data.unauthorized) sessionStorage.removeItem(TOKEN_KEY);
      throw new Error(data.message || "Unable to load data.");
    }
    return data;
  }

  async function post(payload){
    const t = await login();
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({...payload,token:t})
    });
    const data = await res.json();

    if(!data.success){
      if(data.unauthorized) sessionStorage.removeItem(TOKEN_KEY);
      throw new Error(data.message || "Request failed.");
    }
    return data;
  }

  function money(value){
    return "৳" + Number(value || 0).toLocaleString("en-US",{maximumFractionDigits:2});
  }

  function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g,ch=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[ch]);
  }

  function message(text,type){
    const el=$("tcMessage");
    el.textContent=text;
    el.className="tc-message show "+(type || "ok");
    setTimeout(()=>{el.className="tc-message";},4500);
  }

  function stats(){
    const totalDue=customers.reduce((s,c)=>s+Number(c.DUE_AMOUNT||0),0);
    $("tcTotal").textContent=customers.length;
    $("tcCollected").textContent=customers.filter(c=>String(c.COLLECT).toLowerCase()==="collected").length;
    $("tcDueCount").textContent=customers.filter(c=>Number(c.DUE_AMOUNT||0)>0).length;
    $("tcDueAmount").textContent=money(totalDue);
  }

  function render(){
    const query=$("tcSearch").value.trim().toLowerCase();
    const filter=$("tcFilter").value;

    const list=customers.filter(c=>{
      const hay=[c.NAME,c.IP,c.PHONE,c.AREA,c.ADDRESS,c.LOCATION].join(" ").toLowerCase();
      if(query && !hay.includes(query)) return false;
      if(filter==="due" && Number(c.DUE_AMOUNT||0)<=0) return false;
      if(filter==="collected" && String(c.COLLECT).toLowerCase()!=="collected") return false;
      return true;
    });

    $("tcCount").textContent=list.length+" customers";
    $("tcRows").innerHTML=list.length ? list.map(c=>{
      const isDue=Number(c.DUE_AMOUNT||0)>0;
      return `<tr>
        <td>${escapeHTML(c.SI)}</td>
        <td><b>${escapeHTML(c.NAME)}</b><br><span class="muted">${escapeHTML(c.EMAIL||"")}</span></td>
        <td>${escapeHTML(c.IP)}</td>
        <td>${escapeHTML(c.PHONE)}</td>
        <td>${escapeHTML(c.AREA)}</td>
        <td>${money(Number(c.CUSTOMER_BILL||0)+Number(c.IP_BILL||0))}</td>
        <td><b>${money(c.DUE_AMOUNT)}</b></td>
        <td>${escapeHTML(c.BILLING_DATE||"—")}</td>
        <td><span class="pill ${isDue?"due":"paid"}">${isDue?"DUE":"COLLECTED"}</span></td>
        <td><div class="tc-actions">
          <button class="soft" data-action="edit" data-ip="${escapeHTML(c.IP)}">Edit</button>
          <button class="soft" data-action="bill" data-ip="${escapeHTML(c.IP)}">Bill</button>
          <button class="soft" data-action="renew" data-ip="${escapeHTML(c.IP)}">Renew</button>
          <button class="danger" data-action="delete" data-ip="${escapeHTML(c.IP)}">Delete</button>
        </div></td>
      </tr>`;
    }).join("") : `<tr><td colspan="10" class="tc-empty">No customers found.</td></tr>`;

    stats();
  }

  async function loadCustomers(){
    $("tcRows").innerHTML='<tr><td colspan="10" class="tc-empty">Loading customers...</td></tr>';
    try{
      const data=await get("list");
      customers=data.customers || [];
      render();
    }catch(err){
      $("tcRows").innerHTML='<tr><td colspan="10" class="tc-empty">Unable to load customers: '+escapeHTML(err.message)+'</td></tr>';
      message(err.message,"err");
    }
  }

  function openModal(id){$(id).classList.add("open");}
  function closeModal(id){$(id).classList.remove("open");}

  const editFields=[
    ["name","Customer Name","NAME","text"],
    ["ip","Customer IP","IP","text"],
    ["phone","Phone","PHONE","text"],
    ["email","Email","EMAIL","email"],
    ["area","Area","AREA","text"],
    ["address","Address","ADDRESS","text"],
    ["location","Location","LOCATION","text"],
    ["reason","Reason","REASON","text"],
    ["createDate","Create Date","CREATE_DATE","date"],
    ["billingDate","Billing Date","BILLING_DATE","date"],
    ["customerBill","Customer Bill","CUSTOMER_BILL","number"],
    ["ipBill","IP Bill","IP_BILL","number"],
    ["dueAmount","Due Amount","DUE_AMOUNT","number"],
    ["onu","ONU","ONU","text"],
    ["fiber","Fiber","FIBER","text"]
  ];

  function openEdit(c){
    activeCustomer=c;
    $("tcEditForm").elements.oldIp.value=c.IP;

    $("tcEditFields").innerHTML=editFields.map(([key,label,col,type])=>
      `<div class="tc-field"><label>${label}</label><input name="${key}" type="${type}" value="${escapeHTML(c[col]??"")}" ${type==="number"?'step="0.01" min="0"':""}></div>`
    ).join("") + `
      <div class="tc-field"><label>Bill Trigger</label><select name="billTrigger"><option value="ON" ${c.BILL_TRIGGER==="ON"?"selected":""}>ON</option><option value="OFF" ${c.BILL_TRIGGER==="OFF"?"selected":""}>OFF</option></select></div>
      <div class="tc-field"><label>IP Bill Trigger</label><select name="ipBillTrigger"><option value="ON" ${c.IP_BILL_TRIGGER==="ON"?"selected":""}>ON</option><option value="OFF" ${c.IP_BILL_TRIGGER==="OFF"?"selected":""}>OFF</option></select></div>
      <div class="tc-field"><label>Collection Status</label><select name="collect"><option value="Due" ${c.COLLECT==="Due"?"selected":""}>Due</option><option value="Collected" ${c.COLLECT==="Collected"?"selected":""}>Collected</option></select></div>
      <div class="tc-field"><label>Renew Status</label><input name="renew" value="${escapeHTML(c.RENEW||"")}"></div>`;

    openModal("tcEditModal");
  }

  $("tcEditForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=$("tcEditSave");
    btn.disabled=true;
    btn.textContent="Saving...";

    try{
      const fd=new FormData(e.currentTarget);
      const data=Object.fromEntries(fd.entries());
      data.action="edit";
      editFields.filter(x=>x[3]==="number").forEach(x=>data[x[0]]=Number(data[x[0]]||0));

      await post(data);
      closeModal("tcEditModal");
      message("Customer updated successfully.","ok");
      await loadCustomers();
    }catch(err){message(err.message,"err");}
    finally{btn.disabled=false;btn.textContent="Save Changes";}
  });

  function openBill(c){
    activeCustomer=c;
    $("tcBillForm").reset();
    $("tcBillForm").elements.ip.value=c.IP;
    $("tcBillMode").value="due";
    $("tcDueFields").style.display="";
    $("tcBillTitle").textContent="Bill / Payment — "+c.NAME;
    openModal("tcBillModal");
  }

  $("tcBillMode").addEventListener("change",()=>{
    $("tcDueFields").style.display=$("tcBillMode").value==="due"?"":"none";
  });

  $("tcBillForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=$("tcBillSave");
    btn.disabled=true;
    btn.textContent="Processing...";

    try{
      const fd=new FormData(e.currentTarget);
      const data=Object.fromEntries(fd.entries());
      const mode=data.mode;

      if(mode==="due"){
        data.action="addDue";
      }else{
        data.action="collect";
        data.renewBilling=data.renewBilling==="true" ? "true" : "false";
      }

      data.amount=Number(data.amount||0);
      await post(data);
      closeModal("tcBillModal");
      message(mode==="due"?"Due added successfully.":"Payment collected successfully.","ok");
      await loadCustomers();
    }catch(err){message(err.message,"err");}
    finally{btn.disabled=false;btn.textContent="Submit";}
  });

  async function renew(c){
    const current=c.BILLING_DATE || "";
    const input=prompt("New billing date (YYYY-MM-DD):",current);
    if(input===null) return;

    if(!/^\d{4}-\d{2}-\d{2}$/.test(input)){
      message("Please enter date in YYYY-MM-DD format.","err");
      return;
    }

    try{
      await post({action:"edit",oldIp:c.IP,ip:c.IP,billingDate:input,renew:"Renewed"});
      message("Billing date renewed successfully.","ok");
      await loadCustomers();
    }catch(err){message(err.message,"err");}
  }

  async function removeCustomer(c){
    if(!confirm("Delete customer "+c.NAME+" ("+c.IP+")?")) return;
    try{
      await post({action:"delete",ip:c.IP});
      message("Customer moved to Deleted Customer.","ok");
      await loadCustomers();
    }catch(err){message(err.message,"err");}
  }

  $("tcRows").addEventListener("click",e=>{
    const btn=e.target.closest("button[data-action]");
    if(!btn) return;

    const c=customers.find(x=>String(x.IP)===btn.dataset.ip);
    if(!c) return;

    if(btn.dataset.action==="edit") openEdit(c);
    if(btn.dataset.action==="bill") openBill(c);
    if(btn.dataset.action==="renew") renew(c);
    if(btn.dataset.action==="delete") removeCustomer(c);
  });

  $("tcAdd").addEventListener("click",()=>{
    if(typeof window.loadPage==="function"){
      window.loadPage("add-customer",true);
    }else{
      message("Parent page loadPage() function was not found.","err");
    }
  });

  $("tcRefresh").addEventListener("click",loadCustomers);
  $("tcSearch").addEventListener("input",render);
  $("tcFilter").addEventListener("change",render);

  root.querySelectorAll("[data-close]").forEach(btn=>{
    btn.addEventListener("click",()=>closeModal(btn.dataset.close));
  });

  root.querySelectorAll(".tc-modal").forEach(modal=>{
    modal.addEventListener("click",e=>{
      if(e.target===modal) modal.classList.remove("open");
    });
  });

  loadCustomers();
})();
</script>
</body>
</html>
