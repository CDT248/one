
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Total Customer | ONE ONLINE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.primary{background:#087f5b;color:white}
.secondary{background:#e8f1ee;color:#087f5b}
.danger{background:#fee2e2;color:#b91c1c}
.page{padding:20px;max-width:1500px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2{margin:0;font-size:24px}
.muted{color:#64748b;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #e5eaf1;border-radius:12px;padding:16px}
.stat small{color:#64748b}
.stat strong{display:block;font-size:24px;margin-top:8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{background:#fff;border:1px solid #dbe2ea;border-radius:8px;padding:11px;min-width:160px}
.table-wrap{background:#fff;border:1px solid #e5eaf1;border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #edf0f4;font-size:13px}
th{background:#f8fafc;color:#475569;white-space:nowrap}
td{vertical-align:middle}
.name{font-weight:700}
.sub{font-size:12px;color:#64748b;margin-top:4px}
.amount{font-weight:700}
.due{color:#dc2626}
.paid{color:#087f5b}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions button{padding:7px 9px;font-size:12px}
.empty,.loading{text-align:center;padding:30px;color:#64748b}
.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700}
.status.due{background:#fee2e2;color:#b91c1c}
.status.paid{background:#dcfce7;color:#166534}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;align-items:center;justify-content:center;padding:15px;z-index:1000}
.modal{width:100%;max-width:550px;background:#fff;border-radius:14px;padding:20px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0003}
.modal h3{margin:0 0 16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:#475569}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033}
.field textarea{min-height:75px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.notice{padding:12px;border-radius:9px;margin-bottom:12px;font-size:13px;display:none}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
@media(max-width:800px){.page{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.stat strong{font-size:20px}}
@media(max-width:480px){h2{font-size:20px}.toolbar input,.toolbar select{width:100%}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:16px}}
</style>
</head>
<body>

<div class="page">
 <div class="top">
  <div>
   <h2>Total Customer</h2>
   <div class="muted">ONE ONLINE | Customer Management</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="secondary" onclick="loadCustomers()">↻ Refresh</button>
   <button class="primary" onclick="goAddCustomer()">+ Add Customer</button>
  </div>
 </div>

 <div id="notice" class="notice"></div>

 <div class="stats">
  <div class="stat"><small>Total Customers</small><strong id="totalCount">0</strong></div>
  <div class="stat"><small>Collected</small><strong id="collectedCount">0</strong></div>
  <div class="stat"><small>Due Customers</small><strong id="dueCount">0</strong></div>
  <div class="stat"><small>Total Due Amount</small><strong id="totalDue">৳0</strong></div>
 </div>

 <div class="toolbar">
  <input id="search" placeholder="Search name, IP, phone..." oninput="renderCustomers()">
  <select id="filter" onchange="renderCustomers()">
   <option value="all">All Customers</option>
   <option value="due">Due Customers</option>
   <option value="collected">Collected Customers</option>
  </select>
 </div>

 <div class="table-wrap">
  <table>
   <thead><tr>
    <th>SI</th><th>Customer Details</th><th>IP</th><th>Phone</th>
    <th>Area</th><th>Monthly Bill</th><th>Due Amount</th>
    <th>Billing Date</th><th>Status</th><th>Actions</th>
   </tr></thead>
   <tbody id="customerRows">
    <tr><td colspan="10" class="loading">Connecting to API...</td></tr>
   </tbody>
  </table>
 </div>
</div>

<div class="overlay" id="editOverlay">
 <div class="modal">
  <h3>Edit Customer</h3>
  <form id="editForm">
   <input type="hidden" name="oldIp">
   <div class="form-grid">
    <div class="field"><label>Customer Name *</label><input name="name" required></div>
    <div class="field"><label>IP Address *</label><input name="ip" required></div>
    <div class="field"><label>Phone</label><input name="phone"></div>
    <div class="field"><label>Email</label><input name="email"></div>
    <div class="field"><label>Area</label><input name="area"></div>
    <div class="field"><label>Location</label><input name="location"></div>
    <div class="field full"><label>Address</label><textarea name="address"></textarea></div>
    <div class="field"><label>Customer Bill</label><input name="customerBill" type="number" min="0"></div>
    <div class="field"><label>IP Bill</label><input name="ipBill" type="number" min="0"></div>
    <div class="field"><label>Billing Date</label><input name="billingDate" type="date"></div>
    <div class="field"><label>ONU</label><input name="onu"></div>
    <div class="field"><label>Fiber</label><input name="fiber"></div>
    <div class="field full"><label>Reason / Note</label><textarea name="reason"></textarea></div>
   </div>
   <div class="modal-actions">
    <button type="button" class="secondary" onclick="closeModal('editOverlay')">Cancel</button>
    <button class="primary" type="submit">Save Changes</button>
   </div>
  </form>
 </div>
</div>

<div class="overlay" id="billOverlay">
 <div class="modal">
  <h3>Bill / Due / Payment</h3>
  <form id="billForm">
   <input type="hidden" name="ip">
   <div class="form-grid">
    <div class="field full"><label>Action</label>
     <select name="mode" id="billMode" onchange="changeBillMode()">
      <option value="add">Add Bill / Due</option>
      <option value="collect">Collect Payment</option>
     </select>
    </div>
    <div class="field"><label>Amount *</label><input name="amount" type="number" min="1" required></div>
    <div class="field" id="dueFromField"><label>Due From</label><input name="dueFrom" placeholder="e.g. November 2026"></div>
    <div class="field full" id="dueReasonField"><label>Due Reason</label><textarea name="dueReason"></textarea></div>
    <div class="field full"><label>Notes</label><textarea name="notes"></textarea></div>
    <div class="field full" id="renewField" style="display:none">
     <label><input type="checkbox" name="renewBilling" value="true"> Also renew billing date</label>
    </div>
   </div>
   <div class="modal-actions">
    <button type="button" class="secondary" onclick="closeModal('billOverlay')">Cancel</button>
    <button class="primary" type="submit">Submit</button>
   </div>
  </form>
 </div>
</div>

<div class="overlay" id="renewOverlay">
 <div class="modal">
  <h3>Renew Customer</h3>
  <form id="renewForm">
   <input type="hidden" name="ip">
   <div class="field"><label>New Billing Date</label><input name="billingDate" type="date" required></div>
   <div class="modal-actions">
    <button type="button" class="secondary" onclick="closeModal('renewOverlay')">Cancel</button>
    <button class="primary" type="submit">Renew</button>
   </div>
  </form>
 </div>
</div>

<script>
/* =====================================================
   ONE ONLINE API CONFIGURATION
   Password is embedded here as requested.
   Replace YOUR_API_PASSWORD_HERE with your real password.
===================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxrhL_45Ey9QHICYzpNdsYRapqRZv36fzyEORs02MCnlAuju8yF-s5bDOfxY_l5qNrG/exec";

const API_PASSWORD = "PASSWORD12345";

let customers = [];
let authToken = "";
let loginPromise = null;

/* ---------- NOTICE ---------- */
function showNotice(message,type="error"){
 const el=document.getElementById("notice");
 el.textContent=message;
 el.className="notice "+type;
 el.style.display="block";
 setTimeout(()=>el.style.display="none",6000);
}

/* ---------- AUTOMATIC LOGIN ---------- */
async function autoLogin(){
 if(authToken)return authToken;
 if(loginPromise)return loginPromise;

 loginPromise=(async()=>{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({
    action:"login",
    password:API_PASSWORD
   })
  });

  const result=await response.json();

  if(!result.success || !result.token){
   throw new Error(result.message || "API Password Verification Failed");
  }

  authToken=result.token;
  return authToken;
 })();

 try{return await loginPromise;}
 finally{loginPromise=null;}
}

/* ---------- AUTHENTICATED POST ---------- */
async function post(data,retry=true){
 const token=await autoLogin();

 const response=await fetch(API_URL,{
  method:"POST",
  headers:{"Content-Type":"text/plain;charset=utf-8"},
  body:JSON.stringify({...data,token})
 });

 const result=await response.json();

 if(result.unauthorized || result.code==="UNAUTHORIZED"){
  authToken="";

  if(retry){
   await autoLogin();
   return post(data,false);
  }
 }

 if(!response.ok)throw new Error(result.message||"API request failed");
 return result;
}

/* ---------- JSONP GET ---------- */
function getJSONP(params){
 return new Promise((resolve,reject)=>{
  const callback="oneOnlineCallback_"+Date.now()+"_"+Math.floor(Math.random()*10000);
  const script=document.createElement("script");
  const timeout=setTimeout(()=>{
   cleanup();
   reject(new Error("API response timeout."));
  },20000);

  function cleanup(){
   clearTimeout(timeout);
   delete window[callback];
   if(script.parentNode)script.parentNode.removeChild(script);
  }

  window[callback]=(data)=>{
   cleanup();
   resolve(data);
  };

  const query=new URLSearchParams({...params,callback});
  script.src=API_URL+"?"+query.toString();
  script.onerror=()=>{
   cleanup();
   reject(new Error("Unable to connect to Customer API."));
  };
  document.body.appendChild(script);
 });
}

/* ---------- LOAD CUSTOMERS ---------- */
async function loadCustomers(){
 const tbody=document.getElementById("customerRows");
 tbody.innerHTML='<tr><td colspan="10" class="loading">Connecting to API...</td></tr>';

 try{
  await autoLogin();

  let result=await getJSONP({action:"list",token:authToken});

  if(result.unauthorized || result.code==="UNAUTHORIZED"){
   authToken="";
   await autoLogin();
   result=await getJSONP({action:"list",token:authToken});
  }

  if(!result || result.success===false){
   throw new Error(result.message||"Customer list পাওয়া যায়নি।");
  }

  customers=Array.isArray(result.customers)?result.customers:[];
  renderCustomers();
  updateStats();

 }catch(error){
  tbody.innerHTML='<tr><td colspan="10" class="empty">'+escapeHTML(error.message)+'<br><br><button class="primary" onclick="loadCustomers()">Try Again</button></td></tr>';
 }
}

/* ---------- RENDER ---------- */
function renderCustomers(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const filter=document.getElementById("filter").value;

 const filtered=customers.filter(c=>{
  const due=num(c.DUE_AMOUNT);
  const text=[c.NAME,c.IP,c.PHONE,c.AREA,c.ADDRESS,c.LOCATION,c.EMAIL].join(" ").toLowerCase();
  if(q&&!text.includes(q))return false;
  if(filter==="due"&&due<=0)return false;
  if(filter==="collected"&&due>0)return false;
  return true;
 });

 const tbody=document.getElementById("customerRows");

 if(!filtered.length){
  tbody.innerHTML='<tr><td colspan="10" class="empty">No customers found.</td></tr>';
  return;
 }

 tbody.innerHTML=filtered.map((c,index)=>{
  const due=num(c.DUE_AMOUNT);
  const monthly=num(c.CUSTOMER_BILL)+num(c.IP_BILL);
  const status=due>0
   ?'<span class="status due">Due</span>'
   :'<span class="status paid">Collected</span>';

  return `<tr>
   <td>${escapeHTML(c.SI??index+1)}</td>
   <td><div class="name">${escapeHTML(c.NAME)}</div><div class="sub">${escapeHTML(c.EMAIL||"")}</div></td>
   <td>${escapeHTML(c.IP)}</td>
   <td>${escapeHTML(c.PHONE)}</td>
   <td>${escapeHTML(c.AREA)}</td>
   <td>৳${monthly.toLocaleString("en-US")}</td>
   <td class="amount ${due>0?"due":"paid"}">৳${due.toLocaleString("en-US")}</td>
   <td>${escapeHTML(formatDate(c.BILLING_DATE))}</td>
   <td>${status}</td>
   <td><div class="actions">
    <button class="secondary" onclick="openEdit('${js(c.IP)}')">Edit</button>
    <button class="secondary" onclick="openBill('${js(c.IP)}')">Bill</button>
    <button class="secondary" onclick="openRenew('${js(c.IP)}')">Renew</button>
    <button class="danger" onclick="deleteCustomer('${js(c.IP)}')">Delete</button>
   </div></td>
  </tr>`;
 }).join("");
}

/* ---------- STATS ---------- */
function updateStats(){
 const dueCustomers=customers.filter(c=>num(c.DUE_AMOUNT)>0);
 const dueTotal=dueCustomers.reduce((sum,c)=>sum+num(c.DUE_AMOUNT),0);

 document.getElementById("totalCount").textContent=customers.length;
 document.getElementById("dueCount").textContent=dueCustomers.length;
 document.getElementById("collectedCount").textContent=customers.length-dueCustomers.length;
 document.getElementById("totalDue").textContent="৳"+dueTotal.toLocaleString("en-US");
}

/* ---------- EDIT ---------- */
function openEdit(ip){
 const c=customers.find(x=>String(x.IP)===String(ip));
 if(!c)return;

 const f=document.getElementById("editForm");
 f.reset();
 f.elements.oldIp.value=c.IP||"";
 f.elements.name.value=c.NAME||"";
 f.elements.ip.value=c.IP||"";
 f.elements.phone.value=c.PHONE||"";
 f.elements.email.value=c.EMAIL||"";
 f.elements.area.value=c.AREA||"";
 f.elements.location.value=c.LOCATION||"";
 f.elements.address.value=c.ADDRESS||"";
 f.elements.customerBill.value=num(c.CUSTOMER_BILL);
 f.elements.ipBill.value=num(c.IP_BILL);
 f.elements.billingDate.value=toInputDate(c.BILLING_DATE);
 f.elements.onu.value=c.ONU||"";
 f.elements.fiber.value=c.FIBER||"";
 f.elements.reason.value=c.REASON||"";
 openModal("editOverlay");
}

document.getElementById("editForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const f=e.target,btn=f.querySelector('button[type="submit"]');
 btn.disabled=true;btn.textContent="Saving...";

 try{
  const d=Object.fromEntries(new FormData(f).entries());
  const result=await post({
   action:"edit",oldIp:d.oldIp,ip:d.ip,name:d.name,
   phone:d.phone,email:d.email,area:d.area,location:d.location,
   address:d.address,customerBill:d.customerBill,ipBill:d.ipBill,
   billingDate:d.billingDate,onu:d.onu,fiber:d.fiber,reason:d.reason
  });
  if(!result.success)throw new Error(result.message||"Update failed");
  closeModal("editOverlay");
  showNotice("Customer updated successfully.","success");
  await loadCustomers();
 }catch(err){showNotice(err.message)}
 finally{btn.disabled=false;btn.textContent="Save Changes"}
});

/* ---------- BILL / PAYMENT ---------- */
function openBill(ip){
 const f=document.getElementById("billForm");
 f.reset();f.elements.ip.value=ip;
 changeBillMode();openModal("billOverlay");
}

function changeBillMode(){
 const mode=document.getElementById("billMode").value;
 document.getElementById("dueFromField").style.display=mode==="add"?"flex":"none";
 document.getElementById("dueReasonField").style.display=mode==="add"?"flex":"none";
 document.getElementById("renewField").style.display=mode==="collect"?"block":"none";
}

document.getElementById("billForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const f=e.target,d=Object.fromEntries(new FormData(f).entries());
 const btn=f.querySelector('button[type="submit"]');
 btn.disabled=true;btn.textContent="Processing...";

 try{
  let result;
  if(d.mode==="add"){
   result=await post({
    action:"addDue",ip:d.ip,amount:d.amount,dueFrom:d.dueFrom,
    dueReason:d.dueReason,notes:d.notes,user:"Admin"
   });
  }else{
   result=await post({
    action:"collect",ip:d.ip,amount:d.amount,notes:d.notes,
    renewBilling:f.elements.renewBilling.checked
   });
  }
  if(!result.success)throw new Error(result.message||"Operation failed");
  closeModal("billOverlay");
  showNotice("Transaction completed successfully.","success");
  await loadCustomers();
 }catch(err){showNotice(err.message)}
 finally{btn.disabled=false;btn.textContent="Submit"}
});

/* ---------- RENEW ---------- */
function openRenew(ip){
 const f=document.getElementById("renewForm");
 f.reset();f.elements.ip.value=ip;openModal("renewOverlay");
}

document.getElementById("renewForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const f=e.target,d=Object.fromEntries(new FormData(f).entries());
 const btn=f.querySelector('button[type="submit"]');
 btn.disabled=true;btn.textContent="Renewing...";

 try{
  const result=await post({
   action:"edit",oldIp:d.ip,ip:d.ip,
   billingDate:d.billingDate,renew:"Renewed"
  });
  if(!result.success)throw new Error(result.message||"Renew failed");
  closeModal("renewOverlay");
  showNotice("Customer renewed successfully.","success");
  await loadCustomers();
 }catch(err){showNotice(err.message)}
 finally{btn.disabled=false;btn.textContent="Renew"}
});

/* ---------- DELETE ---------- */
async function deleteCustomer(ip){
 if(!confirm("আপনি কি এই Customer Delete করতে চান?"))return;
 try{
  const result=await post({action:"delete",ip});
  if(!result.success)throw new Error(result.message||"Delete failed");
  showNotice("Customer deleted successfully.","success");
  await loadCustomers();
 }catch(err){showNotice(err.message)}
}

/* ---------- HELPERS ---------- */
function num(v){const n=Number(String(v??0).replace(/,/g,""));return Number.isFinite(n)?n:0}
function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function js(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"").replace(/\n/g,"\\n")}
function formatDate(v){if(!v)return "-";const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString("en-GB")}
function toInputDate(v){
 if(!v)return "";
 const d=new Date(v);
 if(!isNaN(d))return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 const m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):"";
}
function openModal(id){document.getElementById(id).style.display="flex"}
function closeModal(id){document.getElementById(id).style.display="none"}
function goAddCustomer(){
 if(typeof window.loadPage==="function")window.loadPage("add-customer",true);
 else location.href="add-customer.html";
}

/* ---------- AUTO START ---------- */
loadCustomers();
</script>
</body>
</html>
